version: '3.8'

services:
  # MongoDB
  mongodb:
    image: mongo:7.0
    container_name: benehab-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: benehab_chat_db
    volumes:
      - mongodb_data:/data/db
    networks:
      - benehab-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend (FastAPI)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: benehab-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - DATABASE_NAME=benehab_chat_db
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - CORS_ORIGINS=http://localhost:3000,http://frontend:3000,http://localhost:3001,http://165.227.24.223:3000
      - DEBUG=True
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - benehab-network
    volumes:
      - ./backend:/app/backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # Frontend (Next.js)
  frontend:
    image: node:20-alpine
    container_name: benehab-frontend
    restart: unless-stopped
    working_dir: /app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://165.227.24.223:8000
      - INTERNAL_API_URL=http://backend:8000
      - NEXT_PUBLIC_BACKEND_URL=http://backend:8000
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    networks:
      - benehab-network
    command: sh -c "npm install && npm run dev"
    depends_on:
      - backend

networks:
  benehab-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local