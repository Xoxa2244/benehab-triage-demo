[project]
name = "color-test"
version = "0.1.0"
description = ""
authors = [
    {name = "JiglioNero",email = "smouk.chayz@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "pandas (>=2.3.3,<3.0.0)",
    "numpy (>=2.3.4,<3.0.0)",
    "pydantic (>=2.12.3,<3.0.0)",
    "beanie (>=2.0.0,<3.0.0)",
    "fastapi (>=0.120.0,<0.121.0)",
    "motor (>=3.3.0,<4.0.0)",
    "uvicorn[standard] (>=0.24.0,<0.25.0)"
]

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"

[tool.poetry]
packages = [{include = "color_test", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
